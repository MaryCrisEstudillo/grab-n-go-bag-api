service: grabngo-bag-api
frameworkVersion: '3'

# Load .env, so `npm run dev` works from a fresh clone without exporting
# anything by hand. In a deployed stage these come from the CI environment.
useDotenv: true

plugins:
  - serverless-esbuild
  - serverless-offline

provider:
  name: aws
  # AWS ended support for nodejs20.x on 2026-04-30: no more security patches,
  # no new functions after 2027-02-01, and no updates to existing ones after
  # 2027-03-03. Bump this together with `custom.esbuild.target`, `.nvmrc` and
  # `render.yaml`, which all describe the same runtime from different angles.
  #
  # Every command prints "Warning: Invalid configuration encountered at
  # 'provider.runtime'". Expected, and safe to ignore: Serverless 3.40 is the
  # last v3, and its bundled list of runtimes was frozen before Lambda added
  # Node 22. It is checking its own schema, not AWS, and the value reaches
  # CloudFormation untouched — `aws lambda list-functions` shows nodejs22.x.
  #
  # Do not silence it with `configValidationMode`. `off` would drop validation
  # for this entire file, so a genuine typo would deploy quietly; `error`, which
  # the accompanying deprecation notice recommends, would turn this one false
  # positive into a failed deploy. That last point is also why moving to v4 is
  # not a bump: v4 makes config warnings fatal by default.
  runtime: nodejs22.x
  region: ${opt:region, 'ap-southeast-1'}
  # `npm run deploy` passes --stage prod explicitly. Without it this default
  # applies, and a bare `serverless deploy` silently stands up a second, whole
  # stack: 18 more functions, a different API URL, and a second copy of the
  # daily digest schedule pointed at the same live database.
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 15
  # Lambda log groups never expire by default, so CloudWatch storage accrues
  # forever for logs nobody will read. This is the line item that quietly bills
  # a small project — more often than compute does.
  logRetentionInDays: 14
  environment:
    NODE_OPTIONS: '--enable-source-maps'
    DATABASE_URL: ${env:DATABASE_URL}
    JWT_SECRET: ${env:JWT_SECRET}
    JWT_EXPIRES_IN: ${env:JWT_EXPIRES_IN, '30d'}
    CORS_ORIGIN: ${env:CORS_ORIGIN, '*'}
    # Absent until mail is set up. The digest job logs and skips rather than
    # failing when these are unset.
    GMAIL_USER: ${env:GMAIL_USER, ''}
    GMAIL_APP_PASSWORD: ${env:GMAIL_APP_PASSWORD, ''}
    EMAIL_FROM_NAME: ${env:EMAIL_FROM_NAME, 'GrabnGo App'}
    APP_URL: ${env:APP_URL, 'http://localhost:3000'}
  httpApi:
    cors:
      # Resolved through a helper because CORS_ORIGIN accepts a comma-separated
      # list, and inlining it here would make the whole string a single entry.
      allowedOrigins: ${file(./scripts/cors.cjs):allowedOrigins}
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PATCH
        - DELETE
      allowCredentials: false

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    format: esm
    # pg ships optional native bindings it can live without; leaving them
    # external keeps esbuild from failing on requires it can't resolve.
    external:
      - pg-native
    outputFileExtension: .mjs
    banner:
      # `format: esm` drops require, which some transitive CJS deps still reach
      # for at load time.
      js: |
        import { createRequire as topLevelCreateRequire } from 'module';
        const require = topLevelCreateRequire(import.meta.url);
  serverless-offline:
    httpPort: 3001
    noPrependStageInUrl: true

functions:
  # ─── Auth ──────────────────────────────────────────────────────────────────
  signIn:
    handler: src/handlers/signIn.handler
    events:
      - httpApi:
          method: POST
          path: /auth/sessions

  signOut:
    handler: src/handlers/signOut.handler
    events:
      - httpApi:
          method: DELETE
          path: /auth/sessions

  register:
    handler: src/handlers/register.handler
    events:
      - httpApi:
          method: POST
          path: /auth/users

  # ─── Notifications ─────────────────────────────────────────────────────────
  sendExpiryDigests:
    handler: src/handlers/sendExpiryDigests.handler
    # Mails every user who has something expiring, one provider call each.
    timeout: 300
    # No reservedConcurrency here, deliberately. A new AWS account's total
    # concurrency limit is 10, and Lambda refuses to reserve any of it while
    # that would leave fewer than 10 unreserved — so reserving even 1 fails the
    # deploy outright. That account-wide limit of 10 is a firmer cap than
    # anything this file could set anyway.
    #
    # Overlapping runs would otherwise risk mailing people twice. What actually
    # prevents that is `last_digest_signature` (migration 003): each user's
    # fingerprint is written after their send, so a retry skips whoever already
    # received one. That guard holds across days, not just across a race, which
    # is why it was the better mechanism to rely on.
    events:
      # 00:00 UTC is 08:00 in Manila — a reminder about food worth checking
      # should arrive over breakfast, not overnight.
      - schedule:
          rate: cron(0 0 * * ? *)
          enabled: true

  unsubscribe:
    handler: src/handlers/unsubscribe.handler
    events:
      - httpApi:
          method: POST
          path: /notifications/unsubscribe

  getCurrentUser:
    handler: src/handlers/getCurrentUser.handler
    events:
      - httpApi:
          method: GET
          path: /auth/users/me

  # ─── Categories ────────────────────────────────────────────────────────────
  listCategories:
    handler: src/handlers/listCategories.handler
    events:
      - httpApi:
          method: GET
          path: /bag/categories

  getCategory:
    handler: src/handlers/getCategory.handler
    events:
      - httpApi:
          method: GET
          path: /bag/categories/{id}

  createCategory:
    handler: src/handlers/createCategory.handler
    events:
      - httpApi:
          method: POST
          path: /bag/categories

  updateCategory:
    handler: src/handlers/updateCategory.handler
    events:
      - httpApi:
          method: PATCH
          path: /bag/categories/{id}

  deleteCategory:
    handler: src/handlers/deleteCategory.handler
    events:
      - httpApi:
          method: DELETE
          path: /bag/categories/{id}

  listItemsByCategory:
    handler: src/handlers/listItemsByCategory.handler
    events:
      - httpApi:
          method: GET
          path: /bag/categories/{id}/items

  # ─── Items ─────────────────────────────────────────────────────────────────
  listItems:
    handler: src/handlers/listItems.handler
    events:
      - httpApi:
          method: GET
          path: /bag/items

  getItem:
    handler: src/handlers/getItem.handler
    events:
      - httpApi:
          method: GET
          path: /bag/items/{id}

  createItem:
    handler: src/handlers/createItem.handler
    events:
      - httpApi:
          method: POST
          path: /bag/items

  updateItem:
    handler: src/handlers/updateItem.handler
    events:
      - httpApi:
          method: PATCH
          path: /bag/items/{id}

  updateItemQuantity:
    handler: src/handlers/updateItemQuantity.handler
    events:
      - httpApi:
          method: PATCH
          path: /bag/items/{id}/quantity

  deleteItem:
    handler: src/handlers/deleteItem.handler
    events:
      - httpApi:
          method: DELETE
          path: /bag/items/{id}

# ─── Cost guardrails ─────────────────────────────────────────────────────────
# Throttling at the API Gateway stage, which is in front of Lambda: a request
# refused here is never invoked, so it costs nothing at all.
#
# HTTP APIs have no `throttle` option in serverless.yml, so this patches the
# stage CloudFormation generates. Rate is sustained requests per second across
# every route; burst is how far above it a spike may briefly go.
#
# 10/s is roughly a thousand times what this app will see and still low enough
# that someone hammering it can't run up a bill. Callers over the limit get 429.
#
# Note this caps the *rate*, not the monthly total — a sustained attack could
# still accumulate. The budget alarm is what catches that; see the README.
resources:
  extensions:
    HttpApiStage:
      Properties:
        DefaultRouteSettings:
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
